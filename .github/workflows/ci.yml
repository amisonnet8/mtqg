name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The lock is implemented per OS (flock and LockFileEx), so every OS runs the checks.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned so a qsoku regression cannot break this CI unnoticed
      # (docs/design/history.md, 2026-09-23).
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@v0.1.1
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
      - name: qsoku check
        shell: bash
        run: qsoku check
      # The end-to-end tests run the real binary against real git repositories, on
      # every operating system: the terminal, the editor and the paths differ.
      - name: qsoku test
        shell: bash
        run: qsoku test

  # -race needs a C compiler, which windows-latest does not have.
  race:
    name: race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@v0.1.1
      - name: qsoku race
        shell: bash
        run: qsoku race

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@v0.1.1
      - name: qsoku shellcheck
        run: qsoku shellcheck

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@v0.1.1
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.71.2
      - name: qsoku trivy
        run: qsoku trivy
