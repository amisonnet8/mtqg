version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: mtqg
    main: ./cmd/mtqg
    binary: mtqg
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/amisonnet8/mtqg/internal/cli.version={{.Version}}

archives:
  - id: mtqg
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  github:
    owner: amisonnet8
    name: mtqg
